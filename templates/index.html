<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Diabetes Prediction</h1>
        <form action="/predict" method="POST">
            <label for="pregnancies">Pregnancies:</label>
            <input type="number" name="pregnancies" required><br>

            <label for="glucose">Glucose:</label>
            <input type="number" name="glucose" required><br>

            <label for="blood_pressure">Blood Pressure:</label>
            <input type="number" name="blood_pressure" required><br>

            <label for="skin_thickness">Skin Thickness:</label>
            <input type="number" name="skin_thickness" required><br>

            <label for="insulin">Insulin:</label>
            <input type="number" name="insulin" required><br>

            <label for="bmi">BMI:</label>
            <input type="number" step="0.01" name="bmi" required><br>

            <label for="diabetes_pedigree">Diabetes Pedigree:</label>
            <input type="number" step="0.01" name="diabetes_pedigree" required><br>

            <label for="age">Age:</label>
            <input type="number" name="age" required><br><br>

            <input type="submit" value="Predict">
        </form>

        {% if prediction %}
        <h2>Prediction: {{ prediction }}</h2>
        {% endif %}
    </div>
</body>
</html>
